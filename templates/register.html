{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}

<style>
  .register-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .register-card {
    background: #fff;
    border-radius: 24px;
    border: 1px solid #ede8f5;
    padding: 44px 48px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 12px 48px rgba(108, 79, 163, 0.10);
  }

  .register-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #8b6bbf, #6c4fa3);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .register-icon svg {
    width: 28px; height: 28px; stroke: #fff; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  .register-card h3 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    color: #1a1133;
    margin: 0 0 4px;
  }

  .register-subtitle {
    text-align: center;
    font-size: 0.88rem;
    color: #9e93b8;
    margin: 0 0 32px;
  }

  /* Crispy form field overrides */
  .register-card .form-group,
  .register-card .mb-3 {
    margin-bottom: 18px !important;
  }
  .register-card label {
    font-size: 0.83rem;
    font-weight: 600;
    color: #4a3d6b;
    margin-bottom: 6px;
    letter-spacing: 0.2px;
  }
  .register-card .form-control {
    border: 1.5px solid #ddd6f0;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.93rem;
    color: #1a1133;
    background: #faf9fd;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .register-card .form-control:focus {
    border-color: #8b6bbf;
    box-shadow: 0 0 0 3px rgba(139, 107, 191, 0.15);
    background: #fff;
    outline: none;
  }
  .register-card .form-control::placeholder {
    color: #c2b8d8;
  }

  /* Help text */
  .register-card .helptext,
  .register-card small.text-muted {
    font-size: 0.78rem;
    color: #b0a5cc;
  }

  /* Error messages */
  .register-card .errorlist {
    list-style: none;
    padding: 0;
    margin: 4px 0 0;
  }
  .register-card .errorlist li {
    font-size: 0.8rem;
    color: #c0392b;
    background: #fdf0ef;
    border-left: 3px solid #e74c3c;
    padding: 5px 10px;
    border-radius: 6px;
    margin-top: 4px;
  }

  /* Submit button */
  .register-submit {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #8b6bbf, #6c4fa3);
    color: #f1e9e9;
    border: none;
    border-radius: 12px;
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s;
  }
  .register-submit:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }
  .register-submit:active {
    transform: translateY(0);
  }

  .register-login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.87rem;
    color: #9e93b8;
  }
  .register-login-link a {
    color: #7c5cbf;
    font-weight: 600;
    text-decoration: none;
  }
  .register-login-link a:hover { text-decoration: underline; }

  .register-divider {
    border: none;
    border-top: 1px solid #ede8f5;
    margin: 28px 0;
  }
</style>

<div class="register-wrapper">
  <div class="register-card">

    <!-- Icon -->
    <div class="register-icon">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
    </div>

    <h3>Create an account</h3>
    <p class="register-subtitle">Join us today — it's free</p>

    <hr class="register-divider">

    <form action="{% url 'register' %}" method="POST">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="register-submit">Create Account</button>
    </form>

    <p class="register-login-link">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </p>

  </div>
</div>

{% endblock content %}
