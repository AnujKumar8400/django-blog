{% extends "base.html" %}

{% block content %}
{% load crispy_forms_tags %}

<style>
  .login-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .login-card {
    background: #fff;
    border-radius: 24px;
    border: 1px solid #ede8f5;
    padding: 44px 48px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 12px 48px rgba(108, 79, 163, 0.10);
  }

  .login-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #8b6bbf, #6c4fa3);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .login-icon svg {
    width: 28px; height: 28px; stroke: #fff; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  .login-card h2 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    color: #1a1133;
    margin: 0 0 4px;
  }

  .login-subtitle {
    text-align: center;
    font-size: 0.88rem;
    color: #9e93b8;
    margin: 0 0 32px;
  }

  .login-card .form-group,
  .login-card .mb-3 {
    margin-bottom: 18px !important;
  }
  .login-card label {
    font-size: 0.83rem;
    font-weight: 600;
    color: #4a3d6b;
    margin-bottom: 6px;
    letter-spacing: 0.2px;
  }
  .login-card .form-control {
    border: 1.5px solid #ddd6f0;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.93rem;
    color: #1a1133;
    background: #faf9fd;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .login-card .form-control:focus {
    border-color: #8b6bbf;
    box-shadow: 0 0 0 3px rgba(139, 107, 191, 0.15);
    background: #fff;
    outline: none;
  }
  .login-card .form-control::placeholder {
    color: #c2b8d8;
  }

  .login-card .helptext,
  .login-card small.text-muted {
    font-size: 0.78rem;
    color: #b0a5cc;
  }

  .login-card .errorlist {
    list-style: none;
    padding: 0;
    margin: 4px 0 0;
  }
  .login-card .errorlist li {
    font-size: 0.8rem;
    color: #c0392b;
    background: #fdf0ef;
    border-left: 3px solid #e74c3c;
    padding: 5px 10px;
    border-radius: 6px;
    margin-top: 4px;
  }

  .login-submit {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #8b6bbf, #6c4fa3);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s;
  }
  .login-submit:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }
  .login-submit:active { transform: translateY(0); }

  .login-register-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.87rem;
    color: #9e93b8;
  }
  .login-register-link a {
    color: #7c5cbf;
    font-weight: 600;
    text-decoration: none;
  }
  .login-register-link a:hover { text-decoration: underline; }

  .login-divider {
    border: none;
    border-top: 1px solid #ede8f5;
    margin: 28px 0;
  }
</style>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Icon -->
    <div class="login-icon">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </div>

    <h2>Welcome back</h2>
    <p class="login-subtitle">Sign in to your account to continue</p>

    <hr class="login-divider">

    <form action="{% url 'login' %}" method="POST">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="login-submit">Sign In</button>
    </form>

    <p class="login-register-link">
      Don't have an account? <a href="{% url 'register' %}">Create one</a>
    </p>

  </div>
</div>

{% endblock content %}
